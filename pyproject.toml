[project]
name = "blender-cactus"
dynamic = ["version"]
description = "Blender Cactus Render Farm - Server and Worker for distributed Blender rendering"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Blender Cactus Team", email = "team@cactus-render.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.optional-dependencies]
all = [
    "cactus-tools[dev]",
    "cactus-server[dev]",
    "cactus-worker[dev]",
]

[workspace]
members = ["cactus-tools", "cactus-server", "cactus-worker"]

[build-system]
requires = ["hatchling", "uv>=0.1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
package = true

[tool.uv.version]
source = "git"
fallback-version = "0.1.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
