name: Setup Branch Protection

on:
  workflow_dispatch:
    inputs:
      enforce:
        description: 'Enforce protection (true) or just check (false)'
        required: false
        default: 'true'
  push:
    branches: [main]
    paths:
      - '.github/branch-protection.yml'

jobs:
  setup-protection:
    name: Configure Branch Protection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Branch Protection
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read branch protection configuration
            const configPath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'branch-protection.yml');
            
            // Try to read YAML (simple parser for this specific file)
            let config = {
              branch: 'main',
              protection: {
                required_pull_request_reviews: {
                  required_approving_review_count: 1,
                  dismiss_stale_reviews: true
                },
                required_status_checks: {
                  strict: true,
                  contexts: []
                },
                enforce_admins: false,
                restrictions: null,
                allow_force_pushes: false,
                allow_deletions: false
              }
            };
            
            try {
              const yaml = require('js-yaml');
              const content = fs.readFileSync(configPath, 'utf8');
              const parsed = yaml.load(content);
              if (parsed) {
                config = parsed;
              }
            } catch (e) {
              console.log('Using default configuration:', e.message);
            }
            
            // Apply branch protection
            const branch = config.branch || 'main';
            const protection = config.protection || {};
            
            // Build the protection object for GitHub API
            const protectionData = {
              required_pull_request_reviews: protection.required_pull_request_reviews,
              required_status_checks: protection.required_status_checks,
              enforce_admins: protection.enforce_admins !== undefined ? protection.enforce_admins : false,
              restrictions: protection.restrictions || null,
              allow_force_pushes: protection.allow_force_pushes !== undefined ? protection.allow_force_pushes : false,
              allow_deletions: protection.allow_deletions !== undefined ? protection.allow_deletions : false
            };
            
            // Add additional fields if present
            if (protection.require_conversation_resolution !== undefined) {
              protectionData.require_conversation_resolution = protection.require_conversation_resolution;
            }
            if (protection.require_linear_history !== undefined) {
              protectionData.require_linear_history = protection.require_linear_history;
            }
            if (protection.require_signed_commits !== undefined) {
              protectionData.require_signed_commits = protection.require_signed_commits;
            }
            
            console.log('Applying branch protection to:', branch);
            console.log('Protection data:', JSON.stringify(protectionData, null, 2));
            
            try {
              const result = await github.request(
                `PUT /repos/${context.repo.owner}/${context.repo.repo}/branches/${branch}/protection`,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: branch,
                  ...protectionData
                }
              );
              console.log('Branch protection applied successfully');
              return result.data;
            } catch (error) {
              console.error('Failed to apply branch protection:', error.message);
              if (error.status === 403) {
                console.error('Permission denied. Make sure the workflow has admin permissions.');
                console.error('You may need to use a PAT with admin rights instead of GITHUB_TOKEN');
              }
              throw error;
            }
