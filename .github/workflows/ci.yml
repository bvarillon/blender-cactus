name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ["cactus-tools", "cactus-server", "cactus-worker"]
        python-version: ["3.11"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Install module and dev dependencies
        run: |
          cd ${{ matrix.module }}
          # Install the module in development mode
          if [ "${{ matrix.module }}" = "cactus-tools" ]; then
            pip install -e .[dev]
          elif [ "${{ matrix.module }}" = "cactus-server" ]; then
            pip install -e ".[dev]" --no-deps
            pip install fastapi uvicorn websockets
          elif [ "${{ matrix.module }}" = "cactus-worker" ]; then
            pip install -e ".[dev]" --no-deps
            pip install websockets
          fi

      - name: Run tests
        run: |
          cd ${{ matrix.module }}
          if [ -d "tests" ] && [ "$(ls tests/*.py 2>/dev/null | wc -l)" -gt 0 ]; then
            python -m pytest tests/ -v --tb=short 2>&1 || echo "::warning:: Tests failed or no tests found"
          else
            echo "::notice:: No tests found for ${{ matrix.module }}"
          fi

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install ruff mypy

      - name: Run ruff
        run: |
          ruff check cactus-tools cactus-server cactus-worker || echo "::warning:: Ruff found linting issues"

      - name: Run mypy
        run: |
          mypy cactus-tools --ignore-missing-imports || echo "::warning:: Mypy found type issues"

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build all packages
        run: |
          for module in cactus-tools cactus-server cactus-worker; do
            echo "Building $module..."
            cd $module
            python -m build --wheel 2>&1 || echo "::warning:: Build failed for $module"
            cd ..
          done
