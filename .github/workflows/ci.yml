name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ["cactus-tools", "cactus-server", "cactus-worker"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd ${{ matrix.module }}
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd ${{ matrix.module }}
          python -m pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage.xml

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check cactus-tools cactus-server cactus-worker

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        run: mypy cactus-tools cactus-server cactus-worker --ignore-missing-imports

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Build cactus-tools
        run: |
          cd cactus-tools
          uv build

      - name: Build cactus-server
        run: |
          cd cactus-server
          uv build

      - name: Build cactus-worker
        run: |
          cd cactus-worker
          uv build
