name: Protect Main Branch

on:
  push:
    branches: [main]

jobs:
  verify-merge-commit:
    name: Verify Merge Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if push is a merge commit
        id: check_merge
        run: |
          # Check if HEAD has multiple parents (merge commit)
          PARENT_COUNT=$(git cat-file -p HEAD | grep -c "^parent ")
          
          # Check commit message for merge patterns
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          
          if [ "$PARENT_COUNT" -ge 2 ] || echo "$COMMIT_MSG" | grep -qi "^Merge"; then
            echo "is_merge=true" >> $GITHUB_OUTPUT
            echo "::notice::This is a valid merge commit"
          else
            echo "is_merge=false" >> $GITHUB_OUTPUT
            echo "::error::This is a direct push, not a merge commit"
          fi

      - name: Block direct push
        if: steps.check_merge.outputs.is_merge != 'true'
        run: |
          echo "::error::Direct pushes to main are not allowed. Please use a pull request."
          exit 1
