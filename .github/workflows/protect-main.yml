name: Protect Main Branch

on:
  push:
    branches: [main]

jobs:
  check-merge-commit:
    name: Verify Merge Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if push is a merge commit
        id: check_merge
        run: |
          # Get the commit message of the push
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          # Check if it's a merge commit (contains "Merge" or has two parents)
          if git cat-file -p HEAD | grep -q "^parent "; then
            if [ $(git cat-file -p HEAD | grep -c "^parent ") -ge 2 ]; then
              echo "is_merge=true" >> $GITHUB_OUTPUT
            else
              echo "is_merge=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "is_merge=false" >> $GITHUB_OUTPUT
          fi
          
          # Also check commit message for merge patterns
          if echo "$COMMIT_MSG" | grep -qi "^Merge"; then
            echo "is_merge=true" >> $GITHUB_OUTPUT
          fi

      - name: Block direct push
        if: steps.check_merge.outputs.is_merge != 'true'
        run: |
          echo "::error::Direct pushes to main are not allowed. Please use a pull request."
          exit 1

  check-pr-approval:
    name: Verify PR Approval
    runs-on: ubuntu-latest
    needs: check-merge-commit
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 1
            });
            
            if (prs.length > 0) {
              const lastPr = prs[0];
              return {
                merged: lastPr.merged,
                merged_at: lastPr.merged_at,
                html_url: lastPr.html_url
              };
            }
            return { merged: false };

      - name: Verify PR was merged
        if: steps.pr_info.outputs.merged != 'true'
        run: |
          echo "::error::Push to main must come from a merged pull request."
          exit 1
