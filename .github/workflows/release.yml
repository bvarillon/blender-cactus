name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional Release
        id: automatic_versioning
        uses: onesoft-sudo/conventional-release-action@v1.8.0
        with:
          create-tag-prefix: 'v'
          allowed-commit-types: 'feat,fix,perf,revert,docs,style,refactor,test,build,ci,chore'

      - name: Create Release
        uses: ncipollo/release-action@v1
        if: ${{ steps.automatic_versioning.outputs.tag != '' }}
        with:
          tag: ${{ steps.automatic_versioning.outputs.tag }}
          name: Release ${{ steps.automatic_versioning.outputs.tag }}
          body: ${{ steps.automatic_versioning.outputs.release_notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
