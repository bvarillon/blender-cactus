name: Release

on:
  push:
    branches:
      - main
      - test

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # - name: Increment version
      #   id: increment-version
      #   uses: RichardInnocent/semantic-versioning-git@v0.0.2
      - name: Compute version
        id: increment-version
        uses: bitshifted/git-auto-semver@v2
          
      - name: Create Release
        uses: ncipollo/release-action@v1
        # if: ${{ steps.increment-version.outputs.new-version != '' }}
        if: ${{ steps.increment-version.outputs.version-string != '' }}
        with:
          # tag: v${{ steps.increment-version.outputs.new-version }}
          # name: Release ${{ steps.increment-version.outputs.new-version }}
          tag: v${{ steps.increment-version.outputs.version-string }}
          name: Release ${{ steps.increment-version.outputs.version-string }}
