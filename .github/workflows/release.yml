name: Release

on:
  push:
    branches:
      - main
      - test

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Increment version
        id: increment-version
        uses: RichardInnocent/semantic-versioning-git@v0.0.2
      
      - name: Print if version changed
        if: steps.increment-version.outputs.previous-version != steps.increment-version.outputs.new-version
        run: echo "The new version is now $new_version"
        env:
          new_version: ${{ steps.increment-version.outputs.new-version }}
          
      - name: Create Release
        uses: ncipollo/release-action@v1
        if: ${{ steps.increment-version.outputs.new-version != '' }}
        with:
          tag: v${{ steps.increment-version.outputs.new-version }}
          name: Release ${{ steps.increment-version.outputs.new-version }}
