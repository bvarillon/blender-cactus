# Branch Protection Configuration for GitHub
# This file documents the protection rules for the main branch
# These settings should be configured in GitHub repository settings

# To apply these settings, use:
# 1. GitHub UI: Settings > Branches > Branch protection rules
# 2. GitHub API: PATCH /repos/{owner}/{repo}/branches/{branch}/protection
# 3. gh CLI: gh api -X PUT repos/{owner}/{repo}/branches/{branch}/protection -f @.github/branch-protection.yml

# Branch protection rule for main
branch: main

protection:
  # Require pull request reviews before merging
  required_pull_request_reviews:
    dismissal_restrictions: {}  # Allow anyone with write/admin to dismiss approvals
    dismiss_stale_reviews: true  # Dismiss approvals when new commits are pushed
    require_code_owner_reviews: false  # Don't require code owner reviews
    required_approving_review_count: 1  # At least 1 approval required
    require_last_push_approval: false
    
  # Require status checks to pass before merging
  required_status_checks:
    strict: true  # Require branches to be up to date before merging
    contexts: ["CI"]  # Require CI workflow to pass
    
  # Enforce all of the above settings
  enforce_admins: false  # Admins can bypass (set to true for stricter enforcement)
  
  # Restrictions on who can push
  restrictions:
    users: []  # No specific users allowed to push directly
    teams: []  # No specific teams allowed to push directly
    apps: []  # No specific apps allowed to push directly

  # Block force pushes
  allow_force_pushes: false
  
  # Block deletions
  allow_deletions: false

  # Require linear history
  require_linear_history: false
  
  # Require conversation resolution before merging
  require_conversation_resolution: true
  
  # Require signed commits
  require_signed_commits: false
  
  # Require deployments to succeed before merging
  required_deployments: []
