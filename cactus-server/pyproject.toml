[project]
name = "cactus-server"
dynamic = ["version"]
description = "Server for Blender Cactus render farm"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cactus-tools>=0.1.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["uv>=0.1.0"]
build-backend = "uv_build"

[tool.uv]
package = true
source = "src/cactus_server"

[tool.uv.version]
source = "git"
fallback-version = "0.1.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
