version: '3.8'

services:
  # Cactus Server
  server:
    build:
      context: .
      dockerfile: cactus-server/Dockerfile
    container_name: cactus-server
    hostname: cactus-server
    restart: unless-stopped
    environment:
      - CACTUS_SERVER_HOST=0.0.0.0
      - CACTUS_SERVER_PORT=8000
      - CACTUS_MAX_WORKERS=100
      - CACTUS_LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./output:/output
    networks:
      - cactus-network
    healthcheck:
      test: ["CMD", "python", "-c", "from cactus_server import CactusServer; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cactus Worker 1
  worker-1:
    build:
      context: .
      dockerfile: cactus-worker/Dockerfile
    container_name: cactus-worker-1
    hostname: cactus-worker-1
    restart: unless-stopped
    environment:
      - CACTUS_SERVER_HOST=server
      - CACTUS_SERVER_PORT=8000
      - CACTUS_WORKER_NAME=worker-1
      - CACTUS_BLENDER_PATH=blender
      - CACTUS_LOG_LEVEL=INFO
    depends_on:
      server:
        condition: service_healthy
    networks:
      - cactus-network
    healthcheck:
      test: ["CMD", "python", "-c", "from cactus_worker import CactusWorker; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cactus Worker 2
  worker-2:
    build:
      context: .
      dockerfile: cactus-worker/Dockerfile
    container_name: cactus-worker-2
    hostname: cactus-worker-2
    restart: unless-stopped
    environment:
      - CACTUS_SERVER_HOST=server
      - CACTUS_SERVER_PORT=8000
      - CACTUS_WORKER_NAME=worker-2
      - CACTUS_BLENDER_PATH=blender
      - CACTUS_LOG_LEVEL=INFO
    depends_on:
      server:
        condition: service_healthy
    networks:
      - cactus-network
    healthcheck:
      test: ["CMD", "python", "-c", "from cactus_worker import CactusWorker; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cactus Worker 3
  worker-3:
    build:
      context: .
      dockerfile: cactus-worker/Dockerfile
    container_name: cactus-worker-3
    hostname: cactus-worker-3
    restart: unless-stopped
    environment:
      - CACTUS_SERVER_HOST=server
      - CACTUS_SERVER_PORT=8000
      - CACTUS_WORKER_NAME=worker-3
      - CACTUS_BLENDER_PATH=blender
      - CACTUS_LOG_LEVEL=INFO
    depends_on:
      server:
        condition: service_healthy
    networks:
      - cactus-network
    healthcheck:
      test: ["CMD", "python", "-c", "from cactus_worker import CactusWorker; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  cactus-network:
    driver: bridge
